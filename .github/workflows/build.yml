name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # "Run workflow" in the Actions tab: tick the box to publish a release of
  # the chosen branch under the version in VERSION.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v<VERSION>)"
        type: boolean
        default: false

env:
  PLATFORMIO_VERSION: "6.2.0"
  LVGL_VERSION: v9.4.0

jobs:
  test:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio==$PLATFORMIO_VERSION
      - run: pio test -d shared

  sim:
    name: HMI simulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: git clone --depth 1 --branch $LVGL_VERSION https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
      - run: cmake -S hmi/sim -B build/sim -G Ninja -DLVGL_DIR="$RUNNER_TEMP/lvgl"
      - run: cmake --build build/sim
      - name: Run the scripted session
        run: mkdir -p build/shots && build/sim/feeder_sim build/shots
      - name: Convert screenshots to PNG
        if: always()
        run: |
          pip install pillow
          python3 -c "import glob; from PIL import Image; [Image.open(f).save(f[:-4] + '.png') for f in glob.glob('build/shots/*.ppm')]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hmi-screenshots
          path: build/shots/*.png

  node:
    name: Node firmware (ESP8266)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-node-${{ hashFiles('node/platformio.ini') }}
      - run: pip install platformio==$PLATFORMIO_VERSION
      - run: pio run -d node
      - uses: actions/upload-artifact@v4
        with:
          name: node-firmware
          path: node/.pio/build/nodemcuv2/firmware.bin

  hmi:
    name: HMI firmware (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-hmi-${{ hashFiles('hmi/platformio.ini') }}
      - run: pip install platformio==$PLATFORMIO_VERSION
      - run: pio run -d hmi
      - uses: actions/upload-artifact@v4
        with:
          name: hmi-firmware
          path: |
            hmi/.pio/build/hmi/firmware.bin
            hmi/.pio/build/hmi/bootloader.bin
            hmi/.pio/build/hmi/partitions.bin
            hmi/.pio/build/hmi/ota_data_initial.bin

  demo:
    name: Browser demo (WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build emscripten
      - run: git clone --depth 1 --branch $LVGL_VERSION https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
      - run: emcmake cmake -S hmi/sim -B build/web -G Ninja -DLVGL_DIR="$RUNNER_TEMP/lvgl" -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/web
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: |
            build/web/feeder_demo.js
            build/web/feeder_demo.wasm

  site:
    name: Assemble the web site
    needs: [node, hmi, demo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build the site
        run: |
          version="$(cat VERSION)+${GITHUB_SHA::7}"
          python3 web/build_site.py --out _site --version "$version" \
            --hmi-dir artifacts/hmi-firmware --node-bin artifacts/node-firmware/firmware.bin \
            --demo-dir artifacts/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    # Only the default branch is published, and only after the tests pass.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [site, test, sim]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish a release
    # Either push a tag such as v0.4.0, or use "Run workflow" with the
    # release box ticked; both attach the firmware files to a release.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [test, sim, node, hmi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag
        id: tag
        run: |
          tag="v$(cat VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($(cat VERSION))." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name the files
        run: |
          mkdir release
          cp artifacts/hmi-firmware/firmware.bin "release/aio-feeder-controller-${{ steps.tag.outputs.tag }}.bin"
          cp artifacts/node-firmware/firmware.bin "release/aio-feeder-feeder-${{ steps.tag.outputs.tag }}.bin"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Raise VERSION before releasing again." >&2
            exit 1
          fi
          # Creates the tag at this commit if it does not exist yet.
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "AIO-Feeder $TAG" \
            --notes "Upload these two files on the controller's update page (Network > Firmware updates), or install from the project web site with a USB cable."
