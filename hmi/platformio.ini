; AIO-Feeder HMI: Waveshare ESP32-S3-Touch-LCD-4.3B (ESP32-S3-N16R8, 800x480 RGB, GT911)
;   pio run -d hmi            build
;   pio run -d hmi -t upload  flash over the UART USB-C port
[env:hmi]
platform = espressif32@8.0.0   ; ESP-IDF 6.1
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
extra_scripts =
    pre:tools/gen_ui_xml.py
    pre:tools/pio_skip_lvgl_asm.py
lib_deps =
    lvgl/lvgl@9.4.0            ; last release with the run-time XML loader
    feeder_core=symlink://../shared/lib/feeder_core
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Wno-error=format          ; LVGL prints uint32_t with %d
