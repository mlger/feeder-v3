; AIO-Feeder node: ESP8266 NodeMCU V3 + DS3231 + relay (12 V solenoid)
;   pio run -d node            build
;   pio run -d node -t upload  flash over USB
; With a DS1302 clock module instead of the DS3231, add -e nodemcuv2_ds1302.
[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:../tools/pio_version.py   ; version from /VERSION
lib_deps =
    feeder_core=symlink://../shared/lib/feeder_core
    adafruit/RTClib@^2.1.4
build_flags =
    -Wall
    ; Hard limits baked into the node. Nothing sent over the air can exceed them.
    -DFD_HARD_MAX_ON_DS=50      ; longest single relay pulse: 5.0 s
    -DFD_HARD_MAX_PULSES=20

; Same node with a DS1302 clock module (CLK D1, DAT D2, RST D0) instead of a DS3231.
[env:nodemcuv2_ds1302]
extends = env:nodemcuv2
lib_deps =
    feeder_core=symlink://../shared/lib/feeder_core
    makuna/Rtc@^2.5.0
build_flags =
    ${env:nodemcuv2.build_flags}
    -DFD_RTC_DS1302
